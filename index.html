<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SPA Accessibilité Lab</title>

  <style>
    /* ✅ contraste corrigé */
    .title {
      color: #222;
    }

    /* ✅ bouton accessible + focus visible */
    button {
      background: #ccc;
      border: none;
      padding: 10px;
    }

    button:focus {
      outline: 3px solid #000;
      outline-offset: 2px;
    }

    /* bonus : input focus visible */
    input:focus {
      outline: 2px solid #000;
    }
  </style>
</head>

<body>

  <!-- ✅ landmark principal -->
  <header>
    <h1 class="title">Bienvenue sur la SPA</h1>
  </header>

  <!-- ✅ input avec label -->
  <main>
    <div>
      <label for="username">Nom utilisateur</label>
      <input id="username" type="text" placeholder="Nom utilisateur">
    </div>

    <!-- ✅ bouton accessible clavier -->
    <div>
      <button type="button" onclick="alert('OK')">
        Valider
      </button>
    </div>

    <!-- ✅ image avec alt -->
    <img src="logo.png" alt="Logo de l'application SPA">

  </main>

</body>
</html>
